name: Test

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  locked:
    name: With locked dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: dtolnay/rust-toolchain@9a1d20035bdbcbc899baabe1e402e85bc33639bc # 1.90.0
      - uses: taiki-e/install-action@cde8c9e634f4a17bc06b61413ac0ef75450eac46 # v2.81.4
        with:
          tool: cargo-hack@0.6.39
      - run: cargo test --locked --all-features --doc
      - run: cargo hack -p okolors --locked --rust-version --feature-powerset --skip default test --lib
      - run: cargo hack -p okolors-cli --locked --rust-version --feature-powerset --skip default test

  minimal:
    name: With minimal dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: dtolnay/rust-toolchain@9a1d20035bdbcbc899baabe1e402e85bc33639bc # 1.90.0
      - uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921 # master
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@cde8c9e634f4a17bc06b61413ac0ef75450eac46 # v2.81.4
        with:
          tool: cargo-hack@0.6.39
      - run: rustup default 1.90
      - run: cargo hack --remove-dev-deps
      - run: rustup run nightly cargo update -Z minimal-versions
      - run: cargo test --locked --all-features --doc
      - run: cargo hack -p okolors --locked --rust-version --feature-powerset --skip default test --lib
      - run: cargo hack -p okolors-cli --locked --rust-version --feature-powerset --skip default test
